<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="{{META_DESCRIPTION}}" />
    <title>{{TITLE}} | Alchemize Resources</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="interior">
    <a class="skip" href="#main">Skip to content</a>
    <header id="site-header"></header>
    <main class="interior-main" id="main">
      <section class="page-hero article-hero">
        <div class="hero-inner">
          <p class="eyebrow kicker-line">{{CATEGORY}}</p>
          <h1>{{TITLE}}</h1>
          <p class="lede">Add short intro copy for this resource.</p>
          <div class="article-meta">
            <span>Practical guide</span><span>Approximately 5 minutes</span>
          </div>
        </div>
      </section>
      <section class="page-section article-page">
        <div class="section-inner article-layout">
          <aside class="article-aside">
            <a href="/resources/">← All Resources</a>
          </aside>
          <article class="article-body">
            <p class="article-intro">
              Add an intro paragraph for this resource.
            </p>
            {{BODY}}
          </article>
        </div>
      </section>
      <section class="interior-cta">
        <div class="section-inner">
          <div>
            <p class="eyebrow">Ready for the next step?</p>
            <h2>Bring organized questions to the conversation.</h2>
          </div>
          <a class="button gold" href="/contact/">Schedule a Consultation</a>
        </div>
      </section>
    </main>
    <footer id="site-footer"></footer>
    <script type="module" src="/script.js"></script>
  </body>
</html>
