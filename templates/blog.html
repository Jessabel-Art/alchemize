<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="{{META_DESCRIPTION}}" />
    <title>{{TITLE}} | Alchemize Blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="interior">
    <a class="skip" href="#main">Skip to content</a>
    <header id="site-header"></header>
    <main class="interior-main" id="main">
      <section class="page-hero article-hero">
        <div class="hero-inner">
          <p class="eyebrow kicker-line">Blog / {{CATEGORY}}</p>
          <h1>{{TITLE}}</h1>
          <p class="lede">Add a summary paragraph for the article.</p>
          <div class="article-meta">
            <span>{{CATEGORY}}</span><span>Approximately 4 minutes</span>
          </div>
        </div>
      </section>
      <section class="page-section article-page">
        <div class="section-inner article-layout">
          <aside class="article-aside">
            <a href="/blog/">← All Blog Posts</a>
          </aside>
          <article class="article-body">
            <p class="article-intro">
              Add the opening insight for this article.
            </p>
            {{BODY}}
          </article>
        </div>
      </section>
    </main>
    <footer id="site-footer"></footer>
    <script type="module" src="/script.js"></script>
  </body>
</html>
