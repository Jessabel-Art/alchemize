name: Quality checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: curl, openssl, zip
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate PHP and migrations
        run: |
          npm run php:lint
          npm run php:test
          npm run migrations:check

      - name: Run static quality checks
        run: npm run check

  browser-quality:
    runs-on: ubuntu-latest
    needs: static-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove preinstalled Google Chrome apt source
        # The GitHub-hosted ubuntu-latest runner image ships with a
        # google-chrome.list apt source pre-registered. `playwright install
        # --with-deps` runs `apt-get update` against every configured
        # source, and dl.google.com's repo intermittently serves a
        # Packages.gz whose hash doesn't match its own Release file,
        # failing the whole step. We only need Playwright's bundled
        # Chromium, not system google-chrome-stable, so drop the source
        # rather than depend on Google's apt CDN being consistent.
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser QA
        run: npm run test:e2e

      - name: Run accessibility checks
        run: npm run test:a11y
