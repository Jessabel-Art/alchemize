name: Build Deploy Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      PUBLIC_WEB_ROOT: public_html
      PRIVATE_BACKEND_ROOT: alchemize-server
      HOSTINGER_SSH_PORT: 65002
      HOSTINGER_SSH_KEY_B64: ${{ secrets.HOSTINGER_SSH_KEY_B64 }}
      HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
      HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
      HOSTINGER_PRIVATE_ROOT: ${{ secrets.HOSTINGER_PRIVATE_ROOT }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build

      - name: Assemble public deployment package
        shell: bash
        run: |
          rm -rf deploy-output
          mkdir -p deploy-output/${PUBLIC_WEB_ROOT}
          mkdir -p deploy-output/${PRIVATE_BACKEND_ROOT}

          cp -R dist/. deploy-output/${PUBLIC_WEB_ROOT}/
          cp -R api deploy-output/${PUBLIC_WEB_ROOT}/api
          cp public/alchemize-api.php deploy-output/${PUBLIC_WEB_ROOT}/alchemize-api.php
          cp public/.htaccess deploy-output/${PUBLIC_WEB_ROOT}/.htaccess

          cp -R server/. deploy-output/${PRIVATE_BACKEND_ROOT}/
          cp -R migrations deploy-output/${PRIVATE_BACKEND_ROOT}/migrations
          cp scripts/run-migrations.php deploy-output/${PRIVATE_BACKEND_ROOT}/run-migrations.php
          cp scripts/verify-deployment-runtime.php deploy-output/${PRIVATE_BACKEND_ROOT}/verify-deployment-runtime.php
          cp scripts/test-resend-email.php deploy-output/${PRIVATE_BACKEND_ROOT}/test-resend-email.php

      - name: Verify deployment package
        shell: bash
        run: |
          php scripts/verify-deployment-runtime.php ./deploy-output

          test -f deploy-output/${PUBLIC_WEB_ROOT}/index.html
          test -f deploy-output/${PUBLIC_WEB_ROOT}/alchemize-api.php
          test -f deploy-output/${PUBLIC_WEB_ROOT}/.htaccess
          test -f deploy-output/${PUBLIC_WEB_ROOT}/api/v1/auth/index.php
          test -d deploy-output/${PUBLIC_WEB_ROOT}/assets

          test -f deploy-output/${PRIVATE_BACKEND_ROOT}/bootstrap.php
          test -f deploy-output/${PRIVATE_BACKEND_ROOT}/services/external-integration-service.php
          test -f deploy-output/${PRIVATE_BACKEND_ROOT}/repositories/external-integration-repository.php
          test -f deploy-output/${PRIVATE_BACKEND_ROOT}/services/google-drive-service.php
          test -f deploy-output/${PRIVATE_BACKEND_ROOT}/services/google-calendar-service.php
          test -d deploy-output/${PRIVATE_BACKEND_ROOT}/migrations
          test -f deploy-output/${PRIVATE_BACKEND_ROOT}/run-migrations.php
          test -f deploy-output/${PRIVATE_BACKEND_ROOT}/verify-deployment-runtime.php
          test -f deploy-output/${PRIVATE_BACKEND_ROOT}/test-resend-email.php

          test ! -e deploy-output/${PUBLIC_WEB_ROOT}/server
          test ! -e deploy-output/${PUBLIC_WEB_ROOT}/.env
          test ! -e deploy-output/${PUBLIC_WEB_ROOT}/migrations

      - name: Deploy and verify private backend on Hostinger
        if: ${{ env.HOSTINGER_SSH_KEY_B64 != '' && env.HOSTINGER_HOST != '' && env.HOSTINGER_USER != '' && env.HOSTINGER_PRIVATE_ROOT != '' }}
        shell: bash
        env:
          SSH_KEY_B64: ${{ secrets.HOSTINGER_SSH_KEY_B64 }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_PRIVATE_ROOT: ${{ secrets.HOSTINGER_PRIVATE_ROOT }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s' "$SSH_KEY_B64" | base64 --decode > ~/.ssh/hostinger_ed25519
          chmod 600 ~/.ssh/hostinger_ed25519

          ssh-keygen -y -f ~/.ssh/hostinger_ed25519 > /dev/null

          ssh-keyscan -H -p "$HOSTINGER_SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

          SSH_CMD="ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 -p $HOSTINGER_SSH_PORT -i ~/.ssh/hostinger_ed25519"

          echo "Testing Hostinger SSH connection..."
          $SSH_CMD "$SSH_USER@$SSH_HOST" "echo SSH_CONNECTION_OK"

          echo "Syncing private backend..."
          rsync -avz --delete \
            -e "$SSH_CMD" \
            --filter='P .env' \
            --filter='P logs/' \
            --filter='P storage/' \
            --filter='P tmp/' \
            --filter='P private/' \
            ./deploy-output/${PRIVATE_BACKEND_ROOT}/ \
            "$SSH_USER@$SSH_HOST:$SSH_PRIVATE_ROOT/"

          echo "Verifying deployment files..."
          $SSH_CMD "$SSH_USER@$SSH_HOST" "
            set -e
            test -f '$SSH_PRIVATE_ROOT/run-migrations.php'
            test -f '$SSH_PRIVATE_ROOT/verify-deployment-runtime.php'
            echo DEPLOYMENT_FILES_OK
          "

          echo "Running migrations..."
          $SSH_CMD "$SSH_USER@$SSH_HOST" \
            "php '$SSH_PRIVATE_ROOT/run-migrations.php'"

          echo "Running production verification..."
          SSH_DOMAIN_ROOT=$(dirname "$SSH_PRIVATE_ROOT")
          $SSH_CMD "$SSH_USER@$SSH_HOST" \
            "php '$SSH_PRIVATE_ROOT/verify-deployment-runtime.php' '$SSH_DOMAIN_ROOT'"

      - name: Publish deploy branch
        if: ${{ always() }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./deploy-output/${{ env.PUBLIC_WEB_ROOT }}
          force_orphan: true
